plugins:
  - slug: tw-ecommerce-ops
    name:
      en: "Taiwan E-Commerce Operations"
      zh: "台灣電商營運"
    description:
      en: "Complete Taiwan e-commerce operations bundle covering multi-platform store management, payment processing, and electronic invoicing for seamless online retail."
      zh: "完整的台灣電商營運組合包，涵蓋多平台商店管理、金流處理與電子發票，實現無縫線上零售。"
    scenario:
      en: "Ideal for Taiwan-based e-commerce businesses managing multiple storefronts across Shopline, 91APP, and CYBERBIZ with integrated ECPay payments and e-invoice compliance."
      zh: "適合在 Shopline、91APP 和 CYBERBIZ 上經營多家店面的台灣電商企業，整合綠界金流與電子發票合規。"
    mcp_servers: [mcp-shopline, mcp-91app, mcp-cyberbiz, mcp-ecpay, mcp-tw-einvoice]
    skills: [skill-ecom-analytics, skill-ecom-rfm-analysis, skill-ecom-inventory-health, skill-ecom-promo-roi]

  - slug: brand-media-pr
    name:
      en: "Brand Media & PR"
      zh: "品牌媒體與公關"
    description:
      en: "Brand monitoring and public relations bundle combining Taiwan social media tracking, news monitoring, and advertising analytics for comprehensive brand management."
      zh: "品牌監測與公關組合包，結合台灣社群媒體追蹤、新聞監測與廣告分析，實現全面品牌管理。"
    scenario:
      en: "Perfect for marketing teams monitoring brand sentiment across PTT, Dcard, and Taiwan news outlets while managing Meta advertising campaigns."
      zh: "適合行銷團隊在 PTT、Dcard 和台灣新聞媒體上監測品牌輿情，同時管理 Meta 廣告活動。"
    upgrade_to: Heimdall
    mcp_servers: [mcp-ptt, mcp-tw-news, mcp-dcard, mcp-meta-ads]
    skills: [skill-pr-media-monitoring, skill-pr-crisis-communication, skill-algo-social-sentiment, skill-biz-brand-positioning]

  - slug: smart-manufacturing
    name:
      en: "Smart Manufacturing"
      zh: "智慧製造"
    description:
      en: "Industrial IoT and smart manufacturing bundle providing sensor data integration, workflow automation, and predictive maintenance capabilities for modern factories."
      zh: "工業物聯網與智慧製造組合包，提供感測器資料整合、工作流自動化與預測性維護功能，適用於現代化工廠。"
    scenario:
      en: "Designed for manufacturing operations integrating Industrial IoT sensors with ThingsBoard dashboards and Node-RED automation for real-time production monitoring."
      zh: "專為整合工業物聯網感測器、ThingsBoard 儀表板與 Node-RED 自動化的製造營運設計，實現即時生產監控。"
    upgrade_to: Asgard
    mcp_servers: [mcp-industrial-iot, mcp-thingsboard, mcp-node-red]
    skills: [skill-mfg-oee-analysis, skill-mfg-predictive-maintenance, skill-mfg-production-planning, skill-algo-mfg-cpk]

  - slug: data-insight
    name:
      en: "Data Insight"
      zh: "數據洞察"
    description:
      en: "Comprehensive data analytics bundle combining web analytics and advertising platforms for unified business intelligence and marketing optimization."
      zh: "全方位數據分析組合包，結合網站分析與廣告平台，實現統一商業情報與行銷優化。"
    scenario:
      en: "Built for data-driven teams leveraging Google Analytics 4 and Meta Ads data to optimize marketing spend and conversion funnels."
      zh: "為數據驅動團隊打造，運用 Google Analytics 4 與 Meta Ads 資料優化行銷花費與轉換漏斗。"
    upgrade_to: Mimir
    mcp_servers: [mcp-ga4, mcp-meta-ads]
    skills: [skill-data-cohort-analysis, skill-mkt-ad-optimization, skill-ecom-analytics, skill-mkt-ab-testing]

  - slug: tw-startup-kit
    name:
      en: "Taiwan Startup Kit"
      zh: "台灣新創工具包"
    description:
      en: "Essential toolkit for Taiwan startups combining CRM and talent acquisition platforms for lean team operations."
      zh: "台灣新創必備工具包，結合 CRM 與人才招募平台，實現精實團隊運營。"
    scenario:
      en: "Tailored for early-stage Taiwan startups using HubSpot for sales and 104/CakeResume for talent recruitment."
      zh: "專為早期台灣新創設計，使用 HubSpot 進行銷售、104/CakeResume 進行人才招募。"
    upgrade_to: Asgard
    mcp_servers: [mcp-hubspot, mcp-104, mcp-cakeresume]
    skills: [skill-ops-business-model-canvas, skill-ops-okr-planning, skill-biz-customer-journey, skill-soc-user-research]

  - slug: agent-communication
    name:
      en: "Agent Communication"
      zh: "AI 代理通訊"
    description:
      en: "Multi-channel communication bundle enabling AI agents to send emails, push notifications, and messages across SendGrid, LINE, and WhatsApp."
      zh: "多通路溝通組合包，讓 AI 代理透過 SendGrid、LINE 和 WhatsApp 發送電子郵件、推播通知與訊息。"
    scenario:
      en: "Ideal for businesses automating customer outreach through email campaigns via SendGrid, LINE notifications, and WhatsApp Business messaging."
      zh: "適合透過 SendGrid 電郵活動、LINE 通知和 WhatsApp Business 訊息自動化客戶觸及的企業。"
    upgrade_to: Sindri
    mcp_servers: [mcp-sendgrid, mcp-line-notify, mcp-whatsapp-business]
    skills: [skill-cs-notification-strategy, skill-soc-stakeholder, skill-ops-negotiation]

  - slug: sea-marketplace
    name:
      en: "SE Asia Marketplace"
      zh: "東南亞電商市集"
    description:
      en: "Southeast Asian marketplace bundle covering Shopee, Lazada, and TikTok Shop with integrated regional payment solutions for cross-border e-commerce."
      zh: "東南亞電商市集組合包，涵蓋 Shopee、Lazada 和 TikTok Shop，整合區域金流方案實現跨境電商。"
    scenario:
      en: "Built for sellers operating across Shopee, Lazada, and TikTok Shop in Southeast Asia with Omise and GrabPay payment integration."
      zh: "為在東南亞 Shopee、Lazada 和 TikTok Shop 上營運的賣家打造，整合 Omise 和 GrabPay 金流。"
    mcp_servers: [mcp-shopee, mcp-lazada, mcp-tiktok-shop, mcp-omise, mcp-grabpay]
    skills: [skill-ecom-conversational, skill-algo-price-dynamic, skill-algo-forecast-arima]

  - slug: finance-investment
    name:
      en: "Finance & Investment"
      zh: "金融與投資"
    description:
      en: "Taiwan financial data bundle providing access to stock exchange data, OTC market information, financial news, and corporate financial statements."
      zh: "台灣金融資料組合包，提供證交所資料、櫃買市場資訊、財經新聞與企業財務報表存取。"
    scenario:
      en: "Designed for investment analysts and financial professionals accessing TWSE, TPEx, Cnyes financial news, and Taiwan corporate financial data."
      zh: "為投資分析師和金融專業人士設計，存取台灣證交所、櫃買中心、鉅亨網財經新聞與台灣企業財務資料。"
    upgrade_to: Asgard
    mcp_servers: [mcp-twse-mops, mcp-tpex, mcp-cnyes, mcp-tw-company-fin]
    skills: [skill-fin-modeling, skill-algo-risk-var, skill-algo-forecast-ensemble]

  - slug: customer-service-hub
    name:
      en: "Customer Service Hub"
      zh: "客服中心"
    description:
      en: "Unified customer service bundle integrating global helpdesk platforms with Taiwan-specific LINE customer engagement for comprehensive support operations."
      zh: "統一客服組合包，整合全球客服平台與台灣 LINE 客戶互動，實現全面的客戶支援營運。"
    scenario:
      en: "Perfect for customer service teams using Freshdesk or Crisp alongside Crescendo Lab for LINE-based customer support in Taiwan."
      zh: "適合使用 Freshdesk 或 Crisp 搭配漸強實驗室在台灣提供 LINE 客服的客服團隊。"
    upgrade_to: Sindri
    mcp_servers: [mcp-freshdesk, mcp-crisp, mcp-crescendo-lab]
    skills: [skill-cs-sop, skill-cs-chatbot-design, skill-cs-analytics]

  - slug: hospitality-ops
    name:
      en: "Hospitality Operations"
      zh: "餐旅營運"
    description:
      en: "Restaurant and hospitality operations bundle combining POS, reservation, and guest management platforms for seamless dining service operations."
      zh: "餐飲與餐旅營運組合包，結合 POS、訂位與賓客管理平台，實現無縫用餐服務營運。"
    scenario:
      en: "Tailored for restaurant groups using iCHEF POS with EZTABLE and TableCheck reservation systems for unified dining operations management."
      zh: "專為使用 iCHEF POS 搭配 EZTABLE 和 TableCheck 訂位系統的餐飲集團設計，實現統一餐飲營運管理。"
    mcp_servers: [mcp-ichef, mcp-eztable, mcp-tablecheck]
    skills: [skill-algo-forecast-arima, skill-ecom-inventory-health, skill-biz-cac-ltv]
