name: Sync gallery content
on:
  schedule:
    - cron: '0 18 * * 0'    # Sunday 18:00 UTC = Mon 02:00 TW
  workflow_dispatch:

# Serialise scheduled and manual runs so a workflow_dispatch never overlaps
# the cron run. Both push directly to main.
concurrency:
  group: sync-gallery-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN is unused — all git/gh auth goes through the App
    # installation token minted below.
    permissions:
      contents: read
    steps:
      # Mint a short-lived (1h) org installation token from the sync GitHub
      # App. Org secrets hold only the App ID + private key. The token spans
      # every repo the App is installed on (cross-org Contents:Read for the
      # sync helpers) and, unlike GITHUB_TOKEN, pushes made with it DO trigger
      # deploy.yml.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Persist the App token as the git remote credential so the push to
          # main authenticates as the App (and triggers deploy.yml).
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      # Expose the App token to every gh-CLI-backed sync step below.
      - run: echo "GH_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"
      - name: Verify token
        env:
          OWNER: ${{ github.repository_owner }}
        run: gh api "orgs/$OWNER/repos?per_page=1" > /dev/null
      # 1) Discover new mcp-* repos (public + private) and append as
      #    coming-soon stubs. Runs FIRST so the same commit contains both the
      #    new stubs and the README/promote outputs below.
      - run: node scripts/sync-gallery/discover-new-mcps.mjs
      # 2) Flip `coming-soon` → `released` for any MCP whose slug-named
      #    package is on PyPI (visibility-gated: private stays coming-soon).
      - run: node scripts/sync-gallery/promote-candidates.mjs
      - run: node scripts/sync-gallery/sync-mcp-content.mjs
      - run: node scripts/sync-gallery/sync-skill-content.mjs
      - name: Sanity-check sync output
        run: node scripts/sync-gallery/check-sync-thresholds.mjs
      - run: npm run validate
      - run: npm run build
      - name: Commit & push sync output to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo 'No content changes to commit.'
            exit 0
          fi
          git commit -m 'chore: sync MCP & skill content'
          # Retry rebase+push in case another writer advances main between
          # our rebase and push (the concurrency group serialises this
          # workflow's own runs, but not other pushers).
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), retrying..."
          done
          echo '::error::push to main failed after 3 attempts'
          exit 1
