name: Sync gallery content
on:
  schedule:
    - cron: '0 18 * * 0'    # Sunday 18:00 UTC = Mon 02:00 TW
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Serialise scheduled and manual runs so a workflow_dispatch never overlaps
# the cron run. Both write to the same rolling branch.
concurrency:
  group: sync-gallery-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - name: Verify token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secrets.GH_TOKEN is empty. This workflow needs a fine-grained PAT with: cross-repo Contents:Read on asgard-ai-platform/* (for sync helpers), plus Contents:Write + Pull-requests:Write on this repo (for the rolling sync PR)."
            exit 1
          fi
          gh api user > /dev/null
      # Flip `coming-soon` → `released` for any MCP whose slug-named package
      # is now on PyPI. Runs BEFORE sync-mcp-content so the newly-promoted
      # entries get their READMEs fetched in the same PR.
      - run: node scripts/sync-gallery/promote-candidates.mjs
      - run: node scripts/sync-gallery/sync-mcp-content.mjs
      - run: node scripts/sync-gallery/sync-skill-content.mjs
      - name: Sanity-check sync output
        run: node scripts/sync-gallery/check-sync-thresholds.mjs
      - run: npm run validate
      - run: npm run build
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/sync-gallery-content
          title: 'chore: sync MCP & skill content from upstream'
          body: |
            Auto-generated by `sync-content.yml`.

            See workflow run for processed counts and any sanity-threshold output.
          commit-message: 'chore: sync MCP & skill content'
          delete-branch: false
          add-paths: |
            data/**
