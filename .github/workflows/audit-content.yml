name: Audit gallery content
on:
  schedule:
    - cron: '0 19 * * *'    # Daily 19:00 UTC = 03:00 TW
    - cron: '0 13 * * 1'    # Mon 13:00 UTC = Mon 21:00 TW; extra run that posts the Slack digest
  workflow_dispatch:
    inputs:
      slack_digest:
        description: 'Post the Slack digest on this run regardless of weekday'
        type: boolean
        default: false

# Serialise scheduled and manual runs so two parallel jobs cannot both miss
# the dedup check and create duplicate tracking issues.
concurrency:
  group: audit-gallery-content
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Mint a short-lived (1h) org installation token from the sync GitHub
      # App. The App must grant cross-org Contents:Read (sync helpers) AND
      # Issues:Write (post-audit-issues creates tracking issues on each
      # mcp-* repo) — the default GITHUB_TOKEN cannot write issues on other
      # repos in the org.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      # Expose the App token to every gh-CLI-backed audit step below.
      - run: echo "GH_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"
      - name: Verify token
        env:
          OWNER: ${{ github.repository_owner }}
        run: gh api "orgs/$OWNER/repos?per_page=1" > /dev/null
      - run: node scripts/sync-gallery/discover-new-skills.mjs
      # discover-new-mcps in report-only mode: appends MCP discovery findings
      # (missing README, empty description, etc.) to the audit report without
      # touching data/mcp-servers.yaml (that's the sync workflow's job).
      - run: DISCOVER_REPORT_ONLY=1 node scripts/sync-gallery/discover-new-mcps.mjs
      - run: node scripts/sync-gallery/audit-pypi.mjs
      - run: node scripts/sync-gallery/audit-readme-format.mjs
      # refresh-boilerplate-descriptions in report-only mode: flags released
      # entries whose gallery name/description are still discovery boilerplate
      # and cannot be auto-refreshed (e.g. README.zh-TW.md missing) without
      # touching data/mcp-servers.yaml (that's the sync workflow's job).
      - run: REFRESH_REPORT_ONLY=1 node scripts/sync-gallery/refresh-boilerplate-descriptions.mjs
      - run: node scripts/sync-gallery/audit-orphans.mjs
      - run: node scripts/sync-gallery/post-audit-issues.mjs scripts/sync-gallery/_generated/repo-audit-report.md
      # Weekly Slack digest: only the Monday 13:00 UTC cron (keyed on the schedule string,
      # not the runner clock, since scheduled runs can start hours late) or a
      # manual run with slack_digest=true. always() so a failed audit still
      # reports (the digest then carries a warning). Skips if the secret is unset.
      - name: Post weekly Slack digest
        if: always() && (github.event.schedule == '0 13 * * 1' || inputs.slack_digest)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUDIT_STATUS: ${{ job.status }}
        run: |
          SCRIPT=scripts/sync-gallery/post-slack-digest.mjs
          if [ -f "$SCRIPT" ]; then
            node "$SCRIPT" scripts/sync-gallery/_generated/repo-audit-report.md
          elif [ -n "$SLACK_WEBHOOK_URL" ]; then
            # Checkout never ran (e.g. App token failure): still tell Slack.
            jq -n --arg t "Yggdrasil gallery audit failed before checkout (status: $AUDIT_STATUS). <$RUN_URL|Workflow run>" '{text: $t}' \
              | curl -fsS --max-redirs 0 -o /dev/null -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repo-audit-report
          path: scripts/sync-gallery/_generated/repo-audit-report.md
