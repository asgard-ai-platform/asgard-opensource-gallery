name: Audit gallery content
on:
  schedule:
    - cron: '0 19 * * *'    # Daily 19:00 UTC = 03:00 TW
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Serialise scheduled and manual runs so two parallel jobs cannot both miss
# the dedup check and create duplicate tracking issues.
concurrency:
  group: audit-gallery-content
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Mint a short-lived (1h) org installation token from the sync GitHub
      # App. The App must grant cross-org Contents:Read (sync helpers) AND
      # Issues:Write (post-audit-issues creates tracking issues on each
      # mcp-* repo) — the default GITHUB_TOKEN cannot write issues on other
      # repos in the org.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      # Expose the App token to every gh-CLI-backed audit step below.
      - run: echo "GH_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"
      - name: Verify token
        env:
          OWNER: ${{ github.repository_owner }}
        run: gh api "orgs/$OWNER/repos?per_page=1" > /dev/null
      - run: node scripts/sync-gallery/discover-new-skills.mjs
      # discover-new-mcps in report-only mode: appends MCP discovery findings
      # (missing README, empty description, etc.) to the audit report without
      # touching data/mcp-servers.yaml (that's the sync workflow's job).
      - run: DISCOVER_REPORT_ONLY=1 node scripts/sync-gallery/discover-new-mcps.mjs
      - run: node scripts/sync-gallery/audit-pypi.mjs
      - run: node scripts/sync-gallery/audit-readme-format.mjs
      - run: node scripts/sync-gallery/audit-orphans.mjs
      - run: node scripts/sync-gallery/post-audit-issues.mjs scripts/sync-gallery/_generated/repo-audit-report.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repo-audit-report
          path: scripts/sync-gallery/_generated/repo-audit-report.md
