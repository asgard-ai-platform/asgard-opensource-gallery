name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main, develop]

# Force Node 24 runtime for any third-party JS actions still pinned to node20
# (e.g. cloudflare/wrangler-action@v3 — no v4 yet that ships with node24).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME || 'asgard-opensource-gallery' }}${{ github.ref_name == 'develop' && '-dev' || '' }} --branch=${{ github.ref_name }}
