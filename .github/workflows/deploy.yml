name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main, develop]
    # Only deploy when something that affects the built site changes. Pushes
    # touching only CI, sync/audit scripts, tests, schemas, or docs are skipped.
    paths:
      - 'data/**'
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'tailwind.config.mjs'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME || 'asgard-opensource-gallery' }}${{ github.ref_name == 'develop' && '-dev' || '' }} --branch=${{ github.ref_name }}
